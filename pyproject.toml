[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iffpcs"
version = "0.1.0"
description = "Cross-layer foundation representations for pseudo-change suppression implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "torchvision>=0.17", "Pillow>=10", "scikit-learn>=1.3"]

[project.scripts]
iffpcs = "iffpcs.cli:main"

[tool.setuptools.packages.find]
include = ["iffpcs*"]
